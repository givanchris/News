name: Deploy Pages

# Replaces the GitHub-managed "legacy" branch-deploy build. Frequent automated
# pushes (options-snapshot cron, Mac Mini auto-update, brief refresh) were
# landing close enough together that overlapping legacy Pages deployments
# intermittently failed with "Deployment failed, try again later." The
# concurrency group below makes runs queue instead of collide.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://givanchris.github.io/News/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # GitHub's Pages deployment API intermittently returns "Deployment
      # failed, try again later" even with no concurrent runs — a known
      # backend flake, not something the concurrency group above prevents.
      # Retry up to 3 times before actually failing the job. `outcome` (not
      # `conclusion`) reflects the step's real result even under
      # continue-on-error, which is what the later `if:` conditions need.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
