name: Deploy Pages

# Replaces the GitHub-managed "legacy" branch-deploy build. Frequent automated
# pushes (options-snapshot cron, Mac Mini auto-update, brief refresh) were
# landing close enough together that overlapping legacy Pages deployments
# intermittently failed with "Deployment failed, try again later." The
# concurrency group below makes runs queue instead of collide.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
