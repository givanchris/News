name: Options Snapshot

# Runs the options-sentiment pipeline on a daily schedule and commits the
# refreshed JSON snapshots into data/options/. Anyone can also trigger it
# manually from the Actions tab via "Run workflow".
on:
  # Schedule disabled — Mac Mini runs this via cron at 4:30 PM MDT weekdays.
  # Manual trigger kept for emergencies.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market snapshot
        working-directory: pipeline
        run: python run.py market

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/options/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Options snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
